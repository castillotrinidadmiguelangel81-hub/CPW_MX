<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Contacto</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .contact-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background-color: var(--primary-color);
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--card-bg);
            background-color: #ecf0f1;
            margin: 0 auto -80px;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: var(--secondary-color);
            object-fit: cover;
        }

        .card-body {
            padding: 60px 30px 30px;
            text-align: center;
        }

        .name {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .title {
            color: #7f8c8d;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .contact-info {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .contact-info li {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .contact-info li svg {
            width: 20px;
            height: 20px;
            fill: var(--secondary-color);
            margin-right: 15px;
            flex-shrink: 0;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        .contact-info a:hover {
            color: var(--secondary-color);
        }

        .btn-contact {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 25px;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        .btn-contact:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="card-header">

            <div class="profile-pic">

                </svg>
            </div>
        </div>
        <div class="card-body">

    </div>

</body>
</html>
